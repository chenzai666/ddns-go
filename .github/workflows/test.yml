name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64, riscv64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Test
        run: |
          # Run tests only when GOARCH is amd64, otherwize run builds only.
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            test -z "$(gofmt -l dns/cloudflare.go dns/cloudflare_test.go)"
            go vet ./...
            go test -race ./dns
            make VERSION="cloudflare-sync-${GITHUB_SHA::12}" build test
          else
            GOARCH=${{ matrix.goarch }} make VERSION="cloudflare-sync-${GITHUB_SHA::12}" build
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ddns-go_${{ matrix.goarch }}
          path: ddns-go
